<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>典籍留痕 · 样式雷典籍消消乐 | 归置传世图档</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #dad0b8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', '华文楷书', 'Microsoft YaHei', '宋体', 'KaiTi', serif;
            margin: 0;
            padding: 16px;
        }

        /* 主面板缩小约20% */
        .game-container {
            max-width: 600px;      /* 原750px */
            width: 100%;
            background: #fef7e8;
            background-image: radial-gradient(circle at 25% 40%, rgba(180, 150, 100, 0.05) 1.2px, transparent 1px);
            background-size: 20px 20px;
            border-radius: 28px;    /* 原32px */
            box-shadow: 0 16px 26px rgba(60, 40, 20, 0.3), inset 0 1px 2px rgba(255, 250, 220, 0.8);
            padding: 18px 18px 24px;  /* 原24px 24px 32px */
            border: 1px solid #cfbc91;
        }

        .title-section {
            text-align: center;
            margin-bottom: 14px;
            border-bottom: 2px solid #ccb27c;
            padding-bottom: 10px;
        }
        h1 {
            font-size: 1.6rem;      /* 原2rem */
            margin: 0;
            letter-spacing: 3px;
            color: #3b2a1f;
            font-weight: 500;
            font-family: '华文楷书', 'KaiTi', serif;
            text-shadow: 1px 1px 0 #e9dcb0;
        }
        .sub {
            font-size: 0.7rem;      /* 原0.85rem */
            color: #6f5436;
            margin-top: 6px;
            letter-spacing: 1px;
        }

        .board-wrapper {
            background: #e9ddc0;
            border-radius: 28px;
            padding: 14px 12px;     /* 原18px 16px */
            margin: 12px 0 16px;
            box-shadow: inset 0 0 0 1px #fff7e8, 0 6px 12px rgba(0, 0, 0, 0.1);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;              /* 原14px */
            justify-items: center;
            align-items: center;
        }

        .card {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #fef7e6;
            border-radius: 16px;    /* 原20px */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.9rem;      /* 原1.05rem */
            font-weight: 500;
            color: #3f2d1b;
            cursor: pointer;
            box-shadow: 3px 4px 8px rgba(60, 40, 20, 0.2);
            transition: all 0.2s ease;
            border: 1px solid #e1ca96;
            font-family: '华文楷书', 'KaiTi', serif;
            padding: 0 4px;
            word-break: keep-all;
            backdrop-filter: blur(1px);
            background-image: linear-gradient(145deg, #fffcf0, #fef3df);
        }
        .card .main-text {
            font-size: 1rem;        /* 原1.2rem */
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .card .sub-text {
            font-size: 0.6rem;      /* 原0.7rem */
            color: #8b6d48;
        }
        .card .icon-hint {
            font-size: 0.6rem;
            margin-top: 3px;
            opacity: 0.6;
        }

        .card:active {
            transform: scale(0.96);
            background: #fcf1df;
        }

        .card.eliminated {
            animation: fadeOutBook 0.35s forwards;
            pointer-events: none;
        }
        @keyframes fadeOutBook {
            0% {
                opacity: 1;
                transform: scale(1);
                background: #fef3e0;
                box-shadow: 3px 4px 8px rgba(0,0,0,0.2);
            }
            100% {
                opacity: 0;
                transform: scale(0.7);
                background: #e9dbbd;
                box-shadow: none;
                border-color: transparent;
                visibility: hidden;
            }
        }

        .card.highlight {
            box-shadow: 0 0 0 2px #f0bc6e, 0 0 0 4px #c99746;
            background: #fff3e0;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #e1cfaa;
            border-radius: 40px;
            padding: 8px 18px;      /* 原10px 24px */
            margin: 14px 0 16px;
            font-weight: 500;
            font-size: 0.85rem;     /* 原0.95rem */
            color: #392d1d;
            box-shadow: inset 0 0 2px #fff1cf, 0 3px 6px rgba(0, 0, 0, 0.08);
        }
        .stat-item {
            background: #5b472e;
            padding: 3px 12px;       /* 原4px 16px */
            border-radius: 32px;
            color: #fef0cf;
            font-size: 0.8rem;      /* 原0.9rem */
            letter-spacing: 0.5px;
        }
        .stat-item span {
            font-weight: bold;
            font-size: 1rem;        /* 原1.2rem */
            margin-left: 4px;
            color: #ffe0a3;
        }
        .timer-warning {
            background: #b6452c;
            animation: gentlePulse 0.6s infinite;
        }
        @keyframes gentlePulse {
            0% { background: #b6452c; box-shadow: 0 0 0 0 #dc8a6a; }
            100% { background: #912f18; box-shadow: 0 0 0 2px rgba(200, 70, 30, 0.3); }
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 18px;              /* 原24px */
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .btn {
            background: #8f734b;
            border: none;
            padding: 6px 20px;      /* 原8px 26px */
            border-radius: 48px;
            font-size: 0.85rem;     /* 原0.95rem */
            font-weight: 500;
            color: #fff3e2;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 2px 3px rgba(0,0,0,0.2);
            transition: 0.08s linear;
            letter-spacing: 1px;
        }
        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .btn-hint {
            background: #6b7652;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(40, 30, 18, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(4px);
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .modal.show {
            visibility: visible;
            opacity: 1;
        }
        .modal-card {
            background: #fff9ef;
            max-width: 300px;       /* 原360px */
            width: 80%;
            border-radius: 40px;
            padding: 20px 16px 26px; /* 原28px 20px 34px */
            text-align: center;
            border: 1px solid #d8bd88;
            box-shadow: 0 15px 25px rgba(0,0,0,0.2);
            font-family: 'KaiTi', serif;
        }
        .modal-card h3 {
            font-size: 1.6rem;      /* 原2rem */
            margin: 6px 0 6px;
            color: #6a4c2c;
        }
        .modal-card p {
            font-size: 0.85rem;     /* 原1rem */
            margin: 10px 0;
            line-height: 1.4;
            color: #3e2c19;
        }
        .modal-card button {
            background: #8f734b;
            border: none;
            padding: 5px 22px;      /* 原6px 28px */
            border-radius: 48px;
            color: white;
            font-size: 0.85rem;
            margin-top: 12px;
            cursor: pointer;
        }

        footer {
            text-align: center;
            font-size: 0.55rem;     /* 原0.65rem */
            color: #ab8a5c;
            margin-top: 16px;
            letter-spacing: 0.5px;
        }

        @media (max-width: 550px) {
            .game-container {
                padding: 12px 12px 18px;
            }
            .grid {
                gap: 8px;
            }
            .card .main-text {
                font-size: 0.85rem;
            }
            .card .sub-text {
                font-size: 0.5rem;
            }
            .btn {
                padding: 5px 16px;
                font-size: 0.75rem;
            }
            .stat-item {
                padding: 2px 8px;
                font-size: 0.7rem;
            }
            .stat-item span {
                font-size: 0.9rem;
            }
            h1 {
                font-size: 1.3rem;
            }
            .stats-bar {
                padding: 6px 12px;
            }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="title-section">
        <h1>📖 典籍消消乐 · 归置传世图档</h1>
        <div class="sub">潜心整理雷氏典籍，守护传世营造文脉</div>
    </div>

    <div class="board-wrapper">
        <div id="gameGrid" class="grid"></div>
    </div>

    <div class="stats-bar">
        <div class="stat-item" id="timerBox">⏱️ 剩余 <span id="timerSeconds">90</span> 秒</div>
        <div class="stat-item">📄 得分 <span id="scoreVal">0</span> 分</div>
        <div class="stat-item">💡 提示 <span id="hintLeft">2</span> 次</div>
    </div>

    <div class="button-group">
        <button id="restartBtn" class="btn">🔄 重新开始</button>
        <button id="hintBtn" class="btn btn-hint">📜 温馨提示</button>
        <button id="exitBtn" class="btn">🚪 退出游戏</button>
    </div>
    <footer>🏯 匠心留典籍 · 文脉永相传</footer>
</div>

<div id="winModal" class="modal">
    <div class="modal-card">
        <div style="font-size: 2.2rem;">🎉</div>
        <h3>通关成功</h3>
        <p>🎉 典籍整理完毕！<br>览传世图档，承营造文脉<br>匠心留典籍，文脉永相传</p>
        <button id="winRestartBtn">再启整理</button>
    </div>
</div>

<div id="failModal" class="modal">
    <div class="modal-card">
        <div style="font-size: 2.2rem;">⏳</div>
        <h3>整理未竟</h3>
        <p>时光未尽，典籍未整理完成<br>重新启程，悉心梳理传世典籍</p>
        <button id="failRestartBtn">重新开局</button>
    </div>
</div>

<script>
    const CATEGORIES = [
        { main: "营造典籍", sub: "样式雷·营法", emoji: "📘" },
        { main: "工程图档", sub: "雷氏手绘", emoji: "📜" },
        { main: "世家文稿", sub: "雷氏家传", emoji: "📖" },
        { main: "陵寝图纸", sub: "清陵工程", emoji: "🗺️" },
        { main: "营造则例", sub: "则例范本", emoji: "📐" },
        { main: "传世卷宗", sub: "雷氏典藏", emoji: "📚" }
    ];
    
    function buildCardSet() {
        let pairs = [];
        for (let i = 0; i < 8; i++) {
            const randomIndex = Math.floor(Math.random() * CATEGORIES.length);
            const template = CATEGORIES[randomIndex];
            const cardData = {
                categoryKey: template.main,
                mainText: template.main,
                subText: template.sub,
                iconHint: template.emoji,
                eliminated: false
            };
            pairs.push({ ...cardData }, { ...cardData });
        }
        for (let i = pairs.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
        }
        return pairs.map((card, idx) => ({
            ...card,
            uniqueId: idx,
            eliminated: false,
            element: null
        }));
    }
    
    let boardCards = [];
    let selectedIndex = null;
    let currentScore = 0;
    let timeLeft = 90;
    let timerInterval = null;
    let gameActive = true;
    let hintRemaining = 2;
    let lockBoard = false;
    
    const gridContainer = document.getElementById("gameGrid");
    const timerSpan = document.getElementById("timerSeconds");
    const scoreSpan = document.getElementById("scoreVal");
    const hintLeftSpan = document.getElementById("hintLeft");
    const restartBtn = document.getElementById("restartBtn");
    const hintBtn = document.getElementById("hintBtn");
    const exitBtn = document.getElementById("exitBtn");
    const winModal = document.getElementById("winModal");
    const failModal = document.getElementById("failModal");
    const winRestart = document.getElementById("winRestartBtn");
    const failRestart = document.getElementById("failRestartBtn");
    const timerBox = document.getElementById("timerBox");
    
    function updateScoreUI() { scoreSpan.innerText = currentScore; }
    function updateHintUI() { hintLeftSpan.innerText = hintRemaining; }
    
    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (!gameActive) return;
            if (timeLeft <= 1) {
                timeLeft = 0;
                timerSpan.innerText = "0";
                stopTimer();
                if (gameActive) {
                    gameActive = false;
                    const allCleared = boardCards.every(card => card.eliminated === true);
                    if (!allCleared) failModal.classList.add("show");
                }
            } else {
                timeLeft--;
                timerSpan.innerText = timeLeft;
                if (timeLeft <= 10) timerBox.classList.add("timer-warning");
                else timerBox.classList.remove("timer-warning");
            }
        }, 1000);
    }
    
    function stopTimer() {
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    }
    
    function renderBoard() {
        gridContainer.innerHTML = "";
        boardCards.forEach((card, idx) => {
            const cardDiv = document.createElement("div");
            cardDiv.className = "card";
            if (!card.eliminated) {
                cardDiv.innerHTML = `
                    <div class="main-text">${card.mainText}</div>
                    <div class="sub-text">${card.subText}</div>
                    <div class="icon-hint">${card.iconHint}</div>
                `;
            } else {
                cardDiv.classList.add("eliminated");
                cardDiv.style.visibility = "hidden";
                cardDiv.innerHTML = "";
            }
            cardDiv.setAttribute("data-index", idx);
            cardDiv.addEventListener("click", (e) => {
                e.stopPropagation();
                if (lockBoard || !gameActive) return;
                if (card.eliminated) return;
                onCardClick(idx);
            });
            gridContainer.appendChild(cardDiv);
            card.element = cardDiv;
        });
    }
    
    function clearHighlights() {
        document.querySelectorAll(".card.highlight").forEach(c => c.classList.remove("highlight"));
    }
    
    function highlightCard(idx) {
        const el = boardCards[idx]?.element;
        if (el) el.classList.add("highlight");
    }
    
    function eliminatePair(idxA, idxB) {
        const cardA = boardCards[idxA];
        const cardB = boardCards[idxB];
        if (!cardA || !cardB) return;
        cardA.eliminated = true;
        cardB.eliminated = true;
        if (cardA.element) {
            cardA.element.classList.add("eliminated");
            cardA.element.innerHTML = "";
        }
        if (cardB.element) {
            cardB.element.classList.add("eliminated");
            cardB.element.innerHTML = "";
        }
    }
    
    function checkWin() {
        const allEliminated = boardCards.every(card => card.eliminated === true);
        if (allEliminated && gameActive === true) {
            gameActive = false;
            stopTimer();
            winModal.classList.add("show");
        }
    }
    
    function showGentleTip(msg) {
        let tip = document.getElementById("gentleTipToast");
        if (!tip) {
            tip = document.createElement("div");
            tip.id = "gentleTipToast";
            tip.style.position = "fixed";
            tip.style.bottom = "80px";
            tip.style.left = "50%";
            tip.style.transform = "translateX(-50%)";
            tip.style.backgroundColor = "#2e281ec9";
            tip.style.backdropFilter = "blur(8px)";
            tip.style.color = "#ffefcf";
            tip.style.padding = "6px 18px";
            tip.style.borderRadius = "36px";
            tip.style.fontSize = "0.75rem";
            tip.style.fontFamily = "'KaiTi',serif";
            tip.style.zIndex = "3000";
            tip.style.pointerEvents = "none";
            document.body.appendChild(tip);
        }
        tip.innerText = msg;
        tip.style.opacity = "1";
        setTimeout(() => tip.style.opacity = "0", 1300);
    }
    
    function onCardClick(clickIdx) {
        const clickedCard = boardCards[clickIdx];
        if (clickedCard.eliminated) return;
        
        if (selectedIndex === null) {
            clearHighlights();
            selectedIndex = clickIdx;
            highlightCard(clickIdx);
            return;
        }
        
        if (selectedIndex === clickIdx) {
            clearHighlights();
            selectedIndex = null;
            return;
        }
        
        const firstCard = boardCards[selectedIndex];
        const secondCard = boardCards[clickIdx];
        
        if (firstCard.mainText === secondCard.mainText) {
            lockBoard = true;
            currentScore += 10;
            updateScoreUI();
            eliminatePair(selectedIndex, clickIdx);
            clearHighlights();
            selectedIndex = null;
            checkWin();
            setTimeout(() => { lockBoard = false; }, 320);
        } else {
            showGentleTip("❀ 请选择相同典籍 ❀");
            clearHighlights();
            selectedIndex = null;
            const wrongEl = document.querySelector(`.card[data-index='${clickIdx}']`);
            if (wrongEl) {
                wrongEl.style.transform = "translateX(2px)";
                setTimeout(() => { if(wrongEl) wrongEl.style.transform = ""; }, 120);
            }
        }
    }
    
    function giveHint() {
        if (!gameActive) { showGentleTip("游戏未开始，请点击重新开始"); return; }
        if (hintRemaining <= 0) { showGentleTip("温馨提示次数已用完，请自行整理典籍📚"); return; }
        const activeCards = boardCards.map((card, idx) => ({ idx, main: card.mainText, eliminated: card.eliminated }))
                                      .filter(c => !c.eliminated);
        const groupMap = new Map();
        for (let item of activeCards) {
            if (!groupMap.has(item.main)) groupMap.set(item.main, []);
            groupMap.get(item.main).push(item.idx);
        }
        let hintPair = null;
        for (let [_, indices] of groupMap.entries()) {
            if (indices.length >= 2) { hintPair = [indices[0], indices[1]]; break; }
        }
        if (!hintPair) { showGentleTip("未发现可匹配典籍？即将接近完成～"); return; }
        hintRemaining--;
        updateHintUI();
        const idxA = hintPair[0], idxB = hintPair[1];
        highlightCard(idxA);
        highlightCard(idxB);
        setTimeout(() => {
            const elA = boardCards[idxA]?.element;
            const elB = boardCards[idxB]?.element;
            if (elA) elA.classList.remove("highlight");
            if (elB) elB.classList.remove("highlight");
        }, 2000);
        showGentleTip(`💡 提示：“${boardCards[idxA].mainText}” 可成一档`);
    }
    
    function resetGame() {
        stopTimer();
        gameActive = true;
        selectedIndex = null;
        currentScore = 0;
        timeLeft = 90;
        hintRemaining = 2;
        updateScoreUI();
        updateHintUI();
        timerSpan.innerText = "90";
        timerBox.classList.remove("timer-warning");
        clearHighlights();
        lockBoard = false;
        boardCards = buildCardSet();
        renderBoard();
        startTimer();
        winModal.classList.remove("show");
        failModal.classList.remove("show");
    }
    
    function exitGame() {
        if (confirm("退出游戏将返回章节正文页面，是否确认离开？")) {
            stopTimer();
            gameActive = false;
            document.body.style.transition = "opacity 0.2s";
            document.body.style.opacity = "0";
            setTimeout(() => {
                document.body.innerHTML = `
                    <div style="text-align:center; margin:15vh auto; max-width:400px; background:#f5ecdb; border-radius:40px; padding:28px 20px; font-family:'KaiTi',serif; box-shadow:0 15px 25px rgba(0,0,0,0.2);">
                        <div style="font-size:2rem;">📜</div>
                        <h2 style="color:#4e3a24;">样式雷 · 文脉传承</h2>
                        <p style="color:#6a4f30;">游戏已关闭，感谢整理雷氏典籍<br>“匠心留典籍，文脉永相传”</p>
                        <button onclick="location.reload()" style="background:#8f734b; border:none; padding:6px 22px; border-radius:40px; color:white; margin-top:16px; cursor:pointer;">重新打开游戏</button>
                    </div>
                `;
                document.body.style.background = "#dad0b8";
                document.body.style.opacity = "1";
            }, 180);
        }
    }
    
    restartBtn.addEventListener("click", resetGame);
    hintBtn.addEventListener("click", giveHint);
    exitBtn.addEventListener("click", exitGame);
    winRestart.addEventListener("click", () => { winModal.classList.remove("show"); resetGame(); });
    failRestart.addEventListener("click", () => { failModal.classList.remove("show"); resetGame(); });
    
    function init() {
        boardCards = buildCardSet();
        renderBoard();
        gameActive = true;
        selectedIndex = null;
        currentScore = 0;
        timeLeft = 90;
        hintRemaining = 2;
        updateScoreUI();
        updateHintUI();
        timerSpan.innerText = "90";
        startTimer();
    }
    init();
</script>
</body>
</html>
