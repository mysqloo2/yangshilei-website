<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>样式雷 · 数字烫样 | 3D 模型鉴赏</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            width: 100%;
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', '宋体', '楷体', 'STKaiti', serif;
            background-color: #0a0806;
            padding-top: 72px;
            overflow-x: hidden;
        }

        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
            opacity: 0.95;
        }

        /* 导航栏 - 固定定位 */
        .nav-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(20, 15, 10, 0.55);
            backdrop-filter: blur(8px);
            padding: 0 2rem;
            z-index: 100;
            border-bottom: 1px solid rgba(210, 180, 140, 0.65);
            height: 72px;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 1.8rem;
            flex-wrap: wrap;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #dac29c;
            font-size: 0.95rem;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid rgba(210, 180, 140, 0.5);
            background: rgba(30, 20, 10, 0.3);
            white-space: nowrap;
        }

        .back-btn:hover {
            background: rgba(210, 180, 140, 0.25);
            color: #f5e7d3;
            border-color: rgba(210, 180, 140, 0.9);
            box-shadow: 0 0 12px rgba(210, 180, 140, 0.3);
        }

        .nav-model-btn {
            background: transparent;
            border: none;
            color: #c4b393;
            font-family: 'Georgia', '楷体', serif;
            font-size: 1.1rem;
            letter-spacing: 3px;
            padding: 8px 24px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            border-bottom: 2px solid transparent;
            background: rgba(255, 252, 245, 0.05);
            border-radius: 0;
            white-space: nowrap;
        }

        .nav-model-btn:hover {
            color: #f5e0c0;
            background: rgba(210, 180, 140, 0.15);
            border-bottom: 2px solid rgba(210, 180, 140, 0.7);
        }

        .nav-model-btn.active {
            color: #fff3e0;
            background: rgba(210, 180, 140, 0.25);
            border-bottom: 2px solid #d4a96a;
            text-shadow: 0 0 8px rgba(210, 180, 140, 0.5);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }

        .tutorial-text {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            color: #cbb295;
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            line-height: 1.6;
            font-family: '楷体', 'STKaiti', '宋体', serif;
            border-right: 1px solid rgba(210, 180, 140, 0.35);
            padding-right: 12px;
            margin-right: 4px;
        }

        .tutorial-text span {
            white-space: nowrap;
        }

        .logo-text {
            font-size: 1.3rem;
            color: #dac29c;
            letter-spacing: 4px;
            font-weight: 500;
            opacity: 0.9;
            white-space: nowrap;
        }

        .light-slider-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(30, 20, 10, 0.35);
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid rgba(210, 180, 140, 0.45);
        }

        .light-slider-group label {
            color: #dac29c;
            font-size: 0.8rem;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .light-slider-group i {
            color: #e6c384;
            font-size: 0.9rem;
        }

        input[type="range"] {
            appearance: none;
            -webkit-appearance: none;
            width: 90px;
            height: 6px;
            background: linear-gradient(to right, #b8945a, #f5e7d3);
            border-radius: 10px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #f5e0c0;
            border-radius: 50%;
            border: 2px solid #8b5a2b;
            box-shadow: 0 0 6px rgba(210, 180, 140, 0.5);
            cursor: pointer;
        }

        /* 3D 模型展示区域 - 固定高度82vh，不随下方内容变化 */
        .model-viewer-container {
            position: relative;
            height: 82vh;
            width: 100%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }

        .canvas-frame {
            width: 92%;
            height: 96%;
            position: relative;
            border: 2px solid #8b4513;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 30px rgba(210, 180, 140, 0.15);
            background: radial-gradient(ellipse at center, #2a1f14 0%, #1a120a 45%, #0a0806 80%);
            backdrop-filter: blur(2px);
        }

        .canvas-frame::before,
        .canvas-frame::after {
            content: "";
            position: absolute;
            width: 24px;
            height: 24px;
            border: 2px solid #8b4513;
            z-index: 20;
            pointer-events: none;
        }

        .canvas-frame::before {
            top: 12px;
            left: 12px;
            border-right: none;
            border-bottom: none;
            border-radius: 6px 0 0 0;
        }

        .canvas-frame::after {
            bottom: 12px;
            right: 12px;
            border-left: none;
            border-top: none;
            border-radius: 0 0 6px 0;
        }

        .corner-bl,
        .corner-tr {
            position: absolute;
            width: 24px;
            height: 24px;
            border: 2px solid #8b4513;
            z-index: 20;
            pointer-events: none;
        }

        .corner-bl {
            bottom: 12px;
            left: 12px;
            border-top: none;
            border-right: none;
            border-radius: 0 0 0 6px;
        }

        .corner-tr {
            top: 12px;
            right: 12px;
            border-bottom: none;
            border-left: none;
            border-radius: 0 6px 0 0;
        }

        .model-label {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.65);
            color: #e2d5c4;
            font-family: 'Georgia', '楷体', serif;
            font-size: 1rem;
            letter-spacing: 4px;
            padding: 6px 28px;
            border-radius: 30px;
            border: 1px solid rgba(210, 180, 140, 0.5);
            backdrop-filter: blur(6px);
            z-index: 25;
            pointer-events: none;
            white-space: nowrap;
        }

        .loading-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #cbb295;
            font-size: 1.2rem;
            letter-spacing: 2px;
            z-index: 15;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 30px;
            border-radius: 30px;
        }

        /* 模型介绍面板 - 无滚动，内容完全展开，自然跟随在场景下方 */
        .info-panel {
            width: calc(100% - 2rem);
            margin: 2rem auto 2.5rem auto;
            background: rgba(20, 15, 10, 0.75);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(210, 180, 140, 0.7);
            border-bottom: 1px solid rgba(210, 180, 140, 0.4);
            color: #e2d5c4;
            padding: 2rem 3rem;
            border-radius: 16px;
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.5);
            font-family: '楷体', 'STKaiti', '宋体', serif;
            letter-spacing: 1.5px;
            line-height: 2;
            z-index: 20;
        }

        .info-title {
            font-size: 1.3rem;
            color: #d4a96a;
            letter-spacing: 4px;
            margin-bottom: 1rem;
            border-left: 3px solid #d4a96a;
            padding-left: 16px;
            font-weight: bold;
            font-family: 'Georgia', '楷体', serif;
        }

        .info-content {
            font-size: 1.1rem;
            white-space: pre-wrap;
            text-align: justify;
            color: #cfc0a9;
        }

        /* 响应式设计 */
        @media (max-width: 900px) {
            .tutorial-text {
                font-size: 0.6rem;
                padding-right: 8px;
            }
            .nav-right {
                gap: 0.8rem;
            }
            .model-viewer-container {
                height: 65vh;
            }
            .info-panel {
                padding: 1.5rem 2rem;
                margin: 1.5rem auto 2rem auto;
            }
            .info-content {
                font-size: 1rem;
            }
            .info-title {
                font-size: 1.15rem;
            }
        }

        @media (max-width: 700px) {
            .nav-bar {
                padding: 0 0.8rem;
                flex-wrap: wrap;
                height: auto;
                min-height: 72px;
                gap: 0.5rem;
            }
            .nav-left {
                gap: 0.8rem;
                order: 1;
                width: 100%;
                justify-content: flex-start;
            }
            .nav-right {
                order: 2;
                width: 100%;
                justify-content: space-between;
            }
            .nav-model-btn {
                font-size: 0.9rem;
                padding: 6px 14px;
                letter-spacing: 1px;
            }
            .back-btn {
                font-size: 0.8rem;
                padding: 4px 12px;
                gap: 4px;
            }
            .logo-text {
                font-size: 1rem;
                letter-spacing: 2px;
            }
            .light-slider-group {
                padding: 3px 10px;
                gap: 6px;
            }
            input[type="range"] {
                width: 70px;
            }
            .tutorial-text {
                font-size: 0.55rem;
                padding-right: 6px;
            }
            .model-viewer-container {
                height: 55vh;
            }
            .info-panel {
                width: calc(100% - 0.8rem);
                margin: 1rem auto 1.5rem auto;
                padding: 1.2rem 1.2rem;
                border-radius: 12px;
            }
            .info-content {
                font-size: 0.95rem;
                line-height: 1.7;
            }
            .info-title {
                font-size: 1.05rem;
                letter-spacing: 2px;
            }
        }
    </style>
</head>
<body>
    <img class="bg-image" src="./images/bg-image.jpg" alt="古风背景">

    <div class="nav-bar">
        <div class="nav-left">
            <a href="digital.html" class="back-btn">
                <span>←</span> <span>返回展厅</span>
            </a>
            <!-- 修改按键顺序：圆明园、长春宫、二次创作长春宫 -->
            <button class="nav-model-btn" id="btnModelYuanmingyuan">🏛️ 圆明园勤政殿</button>
            <button class="nav-model-btn" id="btnModelChangchun">🏯 故宫长春宫烫样</button>
            <button class="nav-model-btn" id="btnModelChangchun2">🏯 二次创作长春宫</button>
        </div>
        <div class="nav-right">
            <div class="tutorial-text">
                <span>左键拖拽 · 旋转</span>
                <span>右键拖拽 · 平移</span>
                <span>滚轮 · 缩放</span>
            </div>
            <div class="light-slider-group">
                <i class="fas fa-sun"></i>
                <label for="lightSlider">灯光</label>
                <input type="range" id="lightSlider" min="0.5" max="5.0" step="0.1" value="2.5">
            </div>
            <span class="logo-text">⚘ 样式雷 · 云上烫样</span>
        </div>
    </div>

    <!-- 3D 模型展示区域 - 固定高度82vh -->
    <div class="model-viewer-container">
        <div class="canvas-frame" id="canvasFrame">
            <div class="corner-tr"></div>
            <div class="corner-bl"></div>
            <div class="model-label" id="modelLabel">圆明园勤政殿</div>
            <div class="loading-hint" id="loadingHint">加载模型中...</div>
        </div>
    </div>

    <!-- 模型介绍面板 - 内容完全展开，无独立滚动条 -->
    <div class="info-panel" id="infoPanel">
        <div class="info-title" id="infoTitle">圆明园勤政殿</div>
        <div class="info-content" id="infoContent">加载介绍中...</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';

        const canvasFrame = document.getElementById('canvasFrame');
        const btnModelYuanmingyuan = document.getElementById('btnModelYuanmingyuan');
        const btnModelChangchun = document.getElementById('btnModelChangchun');
        const btnModelChangchun2 = document.getElementById('btnModelChangchun2');
        const modelLabel = document.getElementById('modelLabel');
        const loadingHint = document.getElementById('loadingHint');
        const lightSlider = document.getElementById('lightSlider');
        const infoTitle = document.getElementById('infoTitle');
        const infoContent = document.getElementById('infoContent');

        // 模型数组存储，索引按 0=圆明园, 1=长春宫, 2=二次创作长春宫 排列
        const models = [
            {
                name: '圆明园勤政殿',
                objFile: './model/yuanmingyuan/yuanmingyuan.obj',
                mtlFile: './model/yuanmingyuan/material.mtl',
                description: `永久官式建筑烫样，是样式雷为圆明园内等级最高的理政建筑制作的模型，现存故宫博物院，也是清代皇家理政建筑烫样的典型遗存。
        勤政殿为圆明园前朝核心建筑，是清代皇帝处理政务、接见外臣的重要场所，烫样以1:100的比例精准还原了建筑形制：单檐歇山顶，面阔五间，前后出廊，梁架、斗拱、额枋等构件均严格遵循清工部《工程做法则例》的官式规制，开间、进深尺寸以斗口模数为基准，结构严谨对称。
        该烫样完整呈现了清代宫廷理政建筑的大木作体系，是研究清代官式建筑模数化营造、等级规制的重要实物参考，也是建模还原清代皇家政务建筑的核心参考范本，尤其适合展示斗拱层级、梁架结构与开间布局等关键营造法式细节。`
            },
            {
                name: '故宫长春宫烫样',
                objFile: './model/gugongchangchungongtangyang/gugongchangchungongtangyang.obj',
                mtlFile: './model/gugongchangchungongtangyang/material.mtl',
                description: `临时建筑烫样，是同治年间样式雷为长春宫院落改造制作的宫廷建筑模型，现藏于故宫博物院，是清代宫廷临时建筑烫样的独特代表。
        长春宫为慈禧太后常住的后妃居所，该烫样以"夏季凉棚"为核心，还原了专为院落看戏、避暑搭建的罩棚结构：整体为悬山顶苇席罩棚，以杉篙立柱支撑，顶部设天窗、卷箔与油布防雨构件，四周无固定檐墙，整体可拆装，适配夏季通风纳凉的功能需求。
        烫样完整保留了长春宫院落的凹字形布局，同时清晰展现了清代宫廷临时建筑的构造逻辑，与永久官式建筑形成鲜明对比，是建模还原清代宫廷临时建筑、解读营造法式中"功能适配性设计"的重要参考，也可结合永久建筑结构进行二次创作，完整呈现院落的空间关系。`
            },
            {
                name: '二次创作长春宫',
                objFile: './model/ercichuangzuochangchungong/ercichuangzuochangchungong.obj',
                mtlFile: './model/ercichuangzuochangchungong/material.mtl',
                description: `同治年间样式雷制作的宫廷临时建筑烫样，为慈禧太后夏季看戏、避暑设计的罩棚模型。其核心特征为无固定屋檐的悬山顶苇席凉棚，以杉篙立柱支撑，四周敞开无檐墙，专为适配夏季通风纳凉的功能需求，是清代宫廷临时建筑的典型遗存。
        本模型为基于长春宫院落的二次创作，在原凉棚烫样的院落布局基础上，补充还原了永久建筑的官式屋檐结构。通过补充清代后妃居所常见的单檐歇山顶、官式斗拱与完整檐部构件，将临时罩棚与永久建筑的形制结合，完整呈现了长春宫院落"永久建筑+临时凉棚"的完整空间关系，也更便于展示清代官式建筑的檐部营造法式细节。`
            }
        ];

        let currentModelIndex = 0;  // 0:圆明园

        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x0a0806, 8, 30);

        const camera = new THREE.PerspectiveCamera(45, canvasFrame.clientWidth / canvasFrame.clientHeight, 0.5, 100);
        camera.position.set(6, 4, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(canvasFrame.clientWidth, canvasFrame.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        canvasFrame.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.8, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 3;
        controls.maxDistance = 20;
        controls.maxPolarAngle = Math.PI / 1.8;
        controls.update();

        const ambientLight = new THREE.AmbientLight(0xeeddcc, 0.7);
        scene.add(ambientLight);
        const hemiLight = new THREE.HemisphereLight(0xffeedd, 0x8d6e63, 0.6);
        scene.add(hemiLight);
        const dirLight = new THREE.DirectionalLight(0xfff5e6, 2.5);
        dirLight.position.set(8, 14, 6);
        dirLight.castShadow = true;
        dirLight.receiveShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 50;
        dirLight.shadow.camera.left = -10;
        dirLight.shadow.camera.right = 10;
        dirLight.shadow.camera.top = 10;
        dirLight.shadow.camera.bottom = -6;
        dirLight.shadow.bias = -0.0001;
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0xdac29c, 1.2);
        fillLight.position.set(-3, 2, -4);
        scene.add(fillLight);

        lightSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            dirLight.intensity = val;
            ambientLight.intensity = val * 0.28;
            hemiLight.intensity = val * 0.24;
            fillLight.intensity = val * 0.48;
        });

        let currentModel = null;
        const allButtons = [btnModelYuanmingyuan, btnModelChangchun, btnModelChangchun2];

        function loadModel(modelIndex) {
            loadingHint.style.display = 'block';
            if (currentModel) {
                scene.remove(currentModel);
                currentModel.traverse((child) => {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) {
                        if (Array.isArray(child.material)) {
                            child.material.forEach(m => m.dispose());
                        } else {
                            child.material.dispose();
                        }
                    }
                });
                currentModel = null;
            }

            const modelInfo = models[modelIndex];
            const mtlLoader = new MTLLoader();
            mtlLoader.load(
                modelInfo.mtlFile,
                (materials) => {
                    materials.preload();
                    const objLoader = new OBJLoader();
                    objLoader.setMaterials(materials);
                    objLoader.load(
                        modelInfo.objFile,
                        (obj) => {
                            obj.traverse((child) => {
                                if (child.isMesh) {
                                    child.castShadow = true;
                                    child.receiveShadow = true;
                                }
                            });
                            const box = new THREE.Box3().setFromObject(obj);
                            const center = box.getCenter(new THREE.Vector3());
                            const size = box.getSize(new THREE.Vector3());
                            const maxDim = Math.max(size.x, size.y, size.z);
                            const scale = 4 / maxDim;
                            obj.scale.set(scale, scale, scale);
                            obj.position.set(-center.x * scale, -center.y * scale + 0.5, -center.z * scale);
                            currentModel = obj;
                            scene.add(obj);
                            controls.target.set(0, center.y * scale + 0.5, 0);
                            controls.update();
                            loadingHint.style.display = 'none';
                            modelLabel.textContent = modelInfo.name;
                            updateInfoPanel(modelIndex);
                        },
                        (xhr) => {
                            const percent = Math.floor((xhr.loaded / xhr.total) * 100);
                            loadingHint.textContent = `加载中 ${percent}%`;
                        },
                        (error) => {
                            console.error('OBJ 加载失败:', error);
                            loadingHint.textContent = '模型加载失败，请检查路径';
                        }
                    );
                },
                undefined,
                (error) => {
                    console.error('MTL 加载失败:', error);
                    loadingHint.textContent = '材质加载失败，请检查 MTL 文件';
                }
            );
        }

        function updateInfoPanel(index) {
            const model = models[index];
            infoTitle.textContent = model.name;
            infoContent.textContent = model.description;
        }

        function switchModel(index) {
            if (currentModelIndex === index) return;
            currentModelIndex = index;
            allButtons.forEach((btn, i) => {
                if (i === index) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            loadModel(index);
        }

        // 绑定按钮事件，分别对应新顺序下的索引
        btnModelYuanmingyuan.addEventListener('click', () => switchModel(0));
        btnModelChangchun.addEventListener('click', () => switchModel(1));
        btnModelChangchun2.addEventListener('click', () => switchModel(2));

        // 默认加载第一个模型：圆明园勤政殿
        loadModel(0);
        // 设置初始激活样式
        btnModelYuanmingyuan.classList.add('active');
        btnModelChangchun.classList.remove('active');
        btnModelChangchun2.classList.remove('active');

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            const width = canvasFrame.clientWidth;
            const height = canvasFrame.clientHeight;
            if (width === 0 || height === 0) return;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });

        console.log('✨ 样式雷 · 数字烫样：按键顺序已调整为 圆明园 → 长春宫 → 二次创作长春宫');
    </script>
</body>
</html>
