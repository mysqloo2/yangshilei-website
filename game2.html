<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>样式雷 · 匠心工坊 - 建筑拼图</title>
    <style>
        :root {
            --bg-deep: #0a0806;
            --bg-card: rgba(22, 16, 10, 0.78);
            --border-gold: rgba(210, 180, 140, 0.4);
            --border-gold-hover: rgba(210, 180, 140, 0.65);
            --text-primary: #e8d8b0;
            --text-secondary: #c9a03d;
            --text-muted: #b8a080;
            --accent: #c9a03d;
            --accent-light: #e8c97a;
            --bg-hover: rgba(210, 180, 140, 0.1);
            --bg-active: rgba(201, 160, 61, 0.2);
            --danger: #a0523d;
            --success: #7cba6a;
            --font-serif: 'Georgia', 'Times New Roman', '楷体', 'STKaiti', 'KaiTi', serif;
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 22px;
            --radius-xl: 28px;
            --shadow-card: 0 8px 40px rgba(0, 0, 0, 0.35);
            --shadow-hover: 0 14px 50px rgba(0, 0, 0, 0.5);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: var(--font-serif);
            background-color: var(--bg-deep);
            color: var(--text-primary);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0.55;
            pointer-events: none;
        }

        .app-container {
            position: relative;
            z-index: 10;
            max-width: 1350px;
            margin: 0 auto;
            padding: 16px 20px 30px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            padding: 14px 22px;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-gold);
            box-shadow: var(--shadow-card);
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 7px;
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 15px;
            padding: 10px 18px;
            border-radius: 28px;
            background: rgba(201, 160, 61, 0.08);
            border: 1px solid rgba(201, 160, 61, 0.35);
            transition: all var(--transition);
            cursor: pointer;
            font-family: var(--font-serif);
            letter-spacing: 1px;
            white-space: nowrap;
        }
        .back-btn:hover {
            background: rgba(201, 160, 61, 0.18);
            border-color: var(--accent-light);
            color: var(--accent-light);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(201, 160, 61, 0.18);
        }
        .back-btn svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .game-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .game-tab {
            padding: 10px 18px;
            border-radius: 26px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(210, 180, 140, 0.25);
            color: #b8a080;
            cursor: pointer;
            transition: all var(--transition);
            font-size: 13px;
            letter-spacing: 2px;
            white-space: nowrap;
            font-family: var(--font-serif);
            position: relative;
        }
        .game-tab:hover {
            background: var(--bg-hover);
            border-color: var(--accent);
            color: #d4b870;
            transform: translateY(-1px);
        }
        .game-tab.active {
            background: var(--bg-active);
            border-color: var(--accent);
            color: var(--accent-light);
            box-shadow: 0 0 18px rgba(201, 160, 61, 0.2);
            font-weight: bold;
        }
        .game-tab .tab-icon {
            margin-right: 4px;
        }

        .difficulty-select {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .diff-btn {
            padding: 7px 14px;
            border-radius: 18px;
            background: transparent;
            border: 1px solid rgba(210, 180, 140, 0.35);
            color: #a08060;
            cursor: pointer;
            transition: all var(--transition);
            font-size: 12px;
            letter-spacing: 1px;
            font-family: var(--font-serif);
            white-space: nowrap;
        }
        .diff-btn:hover {
            background: rgba(210, 180, 140, 0.1);
            color: var(--accent);
            border-color: var(--accent);
        }
        .diff-btn.active {
            background: rgba(201, 160, 61, 0.22);
            border-color: var(--accent);
            color: var(--accent-light);
            box-shadow: 0 0 10px rgba(201, 160, 61, 0.2);
        }

        .main-area {
            display: flex;
            gap: 20px;
            flex: 1;
            flex-wrap: wrap;
        }

        .building-panel {
            flex: 0 0 230px;
            background: var(--bg-card);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-gold);
            padding: 18px 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 620px;
            overflow-y: auto;
            box-shadow: var(--shadow-card);
        }
        .building-panel h3 {
            text-align: center;
            font-size: 16px;
            letter-spacing: 3px;
            color: var(--text-secondary);
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(210, 180, 140, 0.2);
            font-family: var(--font-serif);
        }
        .building-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 10px;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(210, 180, 140, 0.18);
            cursor: pointer;
            transition: all var(--transition);
        }
        .building-card:hover {
            background: var(--bg-hover);
            border-color: var(--accent);
            transform: translateX(3px);
        }
        .building-card.active {
            background: var(--bg-active);
            border-color: var(--accent);
            box-shadow: 0 0 14px rgba(201, 160, 61, 0.15);
        }
        .building-card img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid rgba(210, 180, 140, 0.25);
            flex-shrink: 0;
            background: rgba(30, 20, 10, 0.5);
        }
        .building-card .info {
            flex: 1;
            min-width: 0;
        }
        .building-card .name {
            font-size: 13px;
            font-weight: bold;
            color: #e8d8b0;
            margin-bottom: 3px;
            letter-spacing: 1px;
        }
        .building-card .category-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 10px;
            letter-spacing: 1px;
        }
        .tag-palace {
            background: rgba(201, 160, 61, 0.2);
            color: #c9a03d;
        }
        .tag-garden {
            background: rgba(100, 180, 120, 0.2);
            color: #7cba6a;
        }
        .tag-tomb {
            background: rgba(140, 130, 160, 0.2);
            color: #a89aca;
        }

        .puzzle-area {
            flex: 1;
            min-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .puzzle-canvas-container {
            position: relative;
            width: 450px;
            height: 450px;
            max-width: 90vw;
            max-height: 90vw;
            background: rgba(20, 15, 10, 0.6);
            border-radius: var(--radius-md);
            border: 2px solid var(--border-gold);
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }
        .puzzle-grid {
            display: grid;
            width: 100%;
            height: 100%;
        }
        .puzzle-piece {
            background-size: cover;
            cursor: grab;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            border: 1px solid rgba(210, 180, 140, 0.15);
            position: relative;
            image-rendering: auto;
        }
        .puzzle-piece:hover {
            transform: scale(1.03);
            box-shadow: 0 0 12px rgba(201, 160, 61, 0.3);
            z-index: 5;
        }
        .puzzle-piece:active {
            cursor: grabbing;
            transform: scale(1.06);
        }
        .puzzle-piece.selected {
            box-shadow: 0 0 14px 4px #e8c97a !important;
            z-index: 10;
            border-color: #e8c97a;
        }

        .preview-window {
            width: 110px;
            height: 110px;
            border-radius: 10px;
            border: 2px solid rgba(210, 180, 140, 0.4);
            overflow: hidden;
            background: rgba(0, 0, 0, 0.5);
            flex-shrink: 0;
        }
        .preview-window img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .hint-toggle {
            padding: 8px 15px;
            border-radius: 20px;
            background: rgba(201, 160, 61, 0.1);
            border: 1px solid rgba(201, 160, 61, 0.35);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
            letter-spacing: 1px;
            transition: all var(--transition);
            font-family: var(--font-serif);
        }
        .hint-toggle:hover {
            background: rgba(201, 160, 61, 0.2);
        }
        .hint-toggle.active {
            background: rgba(201, 160, 61, 0.28);
            border-color: var(--accent-light);
            color: var(--accent-light);
            box-shadow: 0 0 12px rgba(201, 160, 61, 0.25);
        }

        .stats-panel {
            flex: 0 0 190px;
            background: var(--bg-card);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-gold);
            padding: 22px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            text-align: center;
            box-shadow: var(--shadow-card);
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .stat-label {
            font-size: 12px;
            color: #a08060;
            letter-spacing: 2px;
        }
        .stat-value {
            font-size: 34px;
            font-weight: bold;
            color: var(--accent-light);
            font-family: var(--font-serif);
            line-height: 1;
        }
        .stat-unit {
            font-size: 12px;
            color: #b8a080;
        }
        .progress-bar-wrap {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #8b6914, #c9a03d, #e8c97a);
            border-radius: 3px;
            transition: width 0.4s ease;
        }

        .bottom-bar {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .action-btn {
            padding: 11px 26px;
            border-radius: 28px;
            font-size: 14px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all var(--transition);
            border: 1px solid rgba(210, 180, 140, 0.35);
            font-family: var(--font-serif);
            white-space: nowrap;
        }
        .btn-reset {
            background: transparent;
            color: #b8a080;
        }
        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #d4b870;
            border-color: var(--border-gold-hover);
        }
        .btn-submit {
            background: rgba(201, 160, 61, 0.18);
            color: var(--accent-light);
            border-color: var(--accent);
        }
        .btn-submit:hover {
            background: rgba(201, 160, 61, 0.3);
            box-shadow: 0 0 20px rgba(201, 160, 61, 0.3);
            transform: translateY(-2px);
        }
        .btn-share {
            background: rgba(100, 180, 140, 0.12);
            color: #8cba7a;
            border-color: rgba(100, 180, 140, 0.35);
        }
        .btn-share:hover {
            background: rgba(100, 180, 140, 0.22);
            box-shadow: 0 0 15px rgba(100, 180, 140, 0.2);
            transform: translateY(-2px);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-content {
            background: rgba(28, 18, 10, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-xl);
            border: 2px solid rgba(201, 160, 61, 0.5);
            padding: 36px 28px;
            text-align: center;
            max-width: 440px;
            width: 92%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
        }
        .modal-content h2 {
            font-size: 26px;
            color: var(--accent-light);
            letter-spacing: 3px;
            margin-bottom: 12px;
            font-family: var(--font-serif);
        }
        .modal-content .achievement {
            font-size: 15px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            padding: 10px 18px;
            background: rgba(201, 160, 61, 0.1);
            border-radius: 10px;
            display: inline-block;
            letter-spacing: 1px;
        }
        .modal-content .knowledge {
            font-size: 13px;
            color: #b8a080;
            line-height: 1.8;
            text-align: left;
            padding: 14px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            margin-bottom: 18px;
            letter-spacing: 0.5px;
        }
        .modal-close {
            padding: 10px 24px;
            border-radius: 24px;
            background: rgba(201, 160, 61, 0.18);
            border: 1px solid var(--accent);
            color: var(--accent-light);
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 1px;
            transition: all var(--transition);
            font-family: var(--font-serif);
        }
        .modal-close:hover {
            background: rgba(201, 160, 61, 0.3);
        }

        @media (max-width: 1150px) {
            .main-area {
                flex-direction: column;
            }
            .building-panel {
                flex: 0 0 auto;
                flex-direction: row;
                flex-wrap: wrap;
                max-height: none;
                justify-content: center;
                gap: 8px;
                padding: 14px 10px;
            }
            .building-panel h3 {
                width: 100%;
                margin-bottom: 0;
            }
            .building-card {
                flex: 0 0 auto;
                min-width: 130px;
            }
            .building-card img {
                width: 38px;
                height: 38px;
            }
            .puzzle-canvas-container {
                width: 350px;
                height: 350px;
            }
            .stats-panel {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 14px;
                justify-content: center;
                flex: 0 0 auto;
            }
            .top-bar {
                justify-content: center;
                gap: 10px;
            }
        }
        @media (max-width: 650px) {
            .puzzle-canvas-container {
                width: 280px;
                height: 280px;
            }
            .game-tab {
                padding: 7px 10px;
                font-size: 11px;
                letter-spacing: 1px;
            }
            .back-btn {
                font-size: 13px;
                padding: 8px 14px;
            }
            .diff-btn {
                padding: 5px 10px;
                font-size: 10px;
            }
            .puzzle-area {
                min-width: auto;
            }
            .modal-content {
                padding: 24px 16px;
            }
            .modal-content h2 {
                font-size: 21px;
            }
        }
    </style>
</head>
<body>
    <img class="bg-image" src="./images/bg-image.jpg" alt="背景" onerror="this.style.display='none'">

    <div class="app-container">
        <div class="top-bar">
            <a href="game.html" class="back-btn" title="返回匠心工坊">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                返回匠心工坊
            </a>
            <div class="game-tabs" id="gameTabs">
                <div class="game-tab active" data-game="puzzle"><span class="tab-icon">🧩</span>建筑拼图</div>
                <div class="game-tab" data-game="craft"><span class="tab-icon">🧹</span>古建拂尘</div>
                <div class="game-tab" data-game="quiz"><span class="tab-icon">📝</span>知识答题</div>
                <div class="game-tab" data-game="wall"><span class="tab-icon">💬</span>留言墙</div>
            </div>
            <div class="difficulty-select" id="difficultySelect">
                <div class="diff-btn active" data-diff="3">简单 3×3</div>
                <div class="diff-btn" data-diff="4">普通 4×4</div>
                <div class="diff-btn" data-diff="5">困难 5×5</div>
            </div>
        </div>

        <div class="main-area" id="puzzleGameArea">
            <div class="building-panel" id="buildingPanel"><h3>🏛️ 建筑选择</h3></div>
            <div class="puzzle-area">
                <div class="puzzle-canvas-container" id="puzzleCanvas"><div class="puzzle-grid" id="puzzleGrid"></div></div>
                <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;">
                    <div class="preview-window" id="previewWindow"><img src="" alt="原图预览" id="previewImg"></div>
                    <button class="hint-toggle" id="hintToggle">💡 轮廓提示</button>
                </div>
            </div>
            <div class="stats-panel">
                <div class="stat-item"><span class="stat-label">⏱️ 用时</span><span class="stat-value" id="timerDisplay">0</span><span class="stat-unit">秒</span></div>
                <div class="stat-item"><span class="stat-label">👣 步数</span><span class="stat-value" id="moveCount">0</span><span class="stat-unit">步</span></div>
                <div class="stat-item" style="width:100%;">
                    <span class="stat-label">进度</span>
                    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill" style="width:0%;"></div></div>
                    <span style="font-size:11px;color:#a08060;margin-top:4px;" id="progressText">0%</span>
                </div>
            </div>
        </div>

        <div class="bottom-bar" id="bottomBar">
            <button class="action-btn btn-reset" id="resetBtn">🔄 重置拼图</button>
            <button class="action-btn btn-submit" id="submitBtn">✅ 提交完成</button>
            <button class="action-btn btn-share" id="shareBtn">📤 分享成绩</button>
        </div>
    </div>

    <div class="modal-overlay" id="completionModal">
        <div class="modal-content">
            <h2>🎉 拼图完成！</h2>
            <div class="achievement" id="achievementText">解锁成就：建筑拼图达人</div>
            <div class="knowledge" id="knowledgeText"></div>
            <button class="modal-close" id="modalClose">关闭</button>
        </div>
    </div>

    <script>
        (function() {
            const buildings = [
                { id: 'taihe', name: '故宫太和殿', category: '宫殿', tagClass: 'tag-palace', img: 'images/game-故宫太和殿.jpg', largeImg: 'images/game-故宫太和殿.jpg', knowledge: '【故宫太和殿】样式雷家族曾参与太和殿的多次修缮工程，留下了大量珍贵图档。太和殿面阔十一间，进深五间，是故宫最大的木结构建筑，代表了清代官式建筑的最高等级。' },
                { id: 'tiantan', name: '天坛祈年殿', category: '园林', tagClass: 'tag-garden', img: 'images/game-天坛祈年殿.jpg', largeImg: 'images/game-天坛祈年殿.jpg', knowledge: '【天坛祈年殿】样式雷家族参与了天坛多次修缮，其烫样完整保留了建筑的规制细节。祈年殿为圆形重檐攒尖顶，象征天圆地方，是研究清代祭天建筑的重要实物参考。' },
                { id: 'yiheyuan', name: '颐和园佛香阁', category: '园林', tagClass: 'tag-garden', img: 'images/game-颐和园佛香阁.jpg', largeImg: 'images/game-颐和园佛香阁.jpg', knowledge: '【颐和园佛香阁】样式雷第四代传人雷家玺曾主持颐和园的修建工程。佛香阁高41米，八面三层四重檐，是颐和园的标志性建筑，巧妙利用万寿山地形而建。' },
                { id: 'bishu', name: '承德避暑山庄', category: '园林', tagClass: 'tag-garden', img: 'images/game-承德避暑山庄.jpg', largeImg: 'images/game-承德避暑山庄.jpg', knowledge: '【避暑山庄】样式雷家族参与了避暑山庄及周围寺庙的设计与修建。山庄占地564万平方米，是中国现存最大的古典皇家园林，融合汉、蒙、藏多种建筑风格。' },
                { id: 'dongling', name: '清东陵', category: '陵寝', tagClass: 'tag-tomb', img: 'images/game-清东陵.jpg', largeImg: 'images/game-清东陵.jpg', knowledge: '【清东陵】样式雷家族负责清东陵的选址与规划设计，巧妙运用风水理论。其建筑规制严谨，展现了清代陵寝建筑的最高成就，是样式雷图档中的重要组成部分。' }
            ];

            let currentBuilding = buildings[0];
            let gridSize = 3;
            let pieces = [];                 // 当前排列，存放原始索引 0 ~ total-1
            let moves = 0;
            let timerSeconds = 0;
            let timerInterval = null;
            let gameStarted = false;
            let gameCompleted = false;
            let showHint = false;
            let selectedPos = null;         // 当前选中的格子位置

            const puzzleGrid = document.getElementById('puzzleGrid');
            const previewImg = document.getElementById('previewImg');
            const timerDisplay = document.getElementById('timerDisplay');
            const moveCountDisplay = document.getElementById('moveCount');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            const completionModal = document.getElementById('completionModal');
            const achievementText = document.getElementById('achievementText');
            const knowledgeText = document.getElementById('knowledgeText');

            // 洗牌算法
            function shuffleArray(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
            }

            // 判断排列是否可解：相邻交换玩法要求逆序对为偶数
            function isSolvable(arr) {
                let inversions = 0;
                for (let i = 0; i < arr.length; i++) {
                    for (let j = i + 1; j < arr.length; j++) {
                        if (arr[i] > arr[j]) inversions++;
                    }
                }
                return inversions % 2 === 0;
            }

            function renderBuildingCards() {
                const panel = document.getElementById('buildingPanel');
                panel.innerHTML = '<h3>🏛️ 建筑选择</h3>';
                buildings.forEach((b, i) => {
                    const card = document.createElement('div');
                    card.className = 'building-card' + (b.id === currentBuilding.id ? ' active' : '');
                    card.innerHTML = `<img src="${b.img}" alt="${b.name}" onerror="this.style.background='rgba(201,160,61,0.1)';this.style.display='block';this.style.minWidth='50px';this.style.minHeight='50px';"><div class="info"><div class="name">${b.name}</div><span class="category-tag ${b.tagClass}">${b.category}</span></div>`;
                    card.addEventListener('click', () => selectBuilding(i));
                    panel.appendChild(card);
                });
            }

            function selectBuilding(index) {
                currentBuilding = buildings[index];
                renderBuildingCards();
                resetGame();
            }

            function initPuzzle() {
                const total = gridSize * gridSize;
                pieces = Array.from({ length: total }, (_, i) => i);
                do { shuffleArray(pieces); } while (!isSolvable(pieces));
                moves = 0;
                timerSeconds = 0;
                gameStarted = false;
                gameCompleted = false;
                selectedPos = null;
                updateStats();
                renderPuzzle();
                stopTimer();
                timerDisplay.textContent = '0';
            }

            function renderPuzzle() {
                puzzleGrid.innerHTML = '';
                puzzleGrid.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
                puzzleGrid.style.gridTemplateRows = `repeat(${gridSize}, 1fr)`;
                const canvasEl = document.getElementById('puzzleCanvas');
                const canvasSize = canvasEl ? canvasEl.clientWidth : 450;

                pieces.forEach((pieceIndex, pos) => {
                    const piece = document.createElement('div');
                    piece.className = 'puzzle-piece';
                    piece.dataset.pos = pos;
                    // 所有方块都有图案
                    const row = Math.floor(pieceIndex / gridSize);
                    const col = pieceIndex % gridSize;
                    piece.style.backgroundImage = `url(${currentBuilding.largeImg})`;
                    piece.style.backgroundSize = `${canvasSize}px ${canvasSize}px`;
                    piece.style.backgroundPosition = `-${col * (canvasSize / gridSize)}px -${row * (canvasSize / gridSize)}px`;

                    piece.addEventListener('click', () => handlePieceClick(pos));

                    if (showHint) {
                        piece.style.outline = '2px dashed rgba(201,160,61,0.4)';
                        piece.style.outlineOffset = '-2px';
                    }
                    if (selectedPos === pos) {
                        piece.classList.add('selected');
                    }
                    puzzleGrid.appendChild(piece);
                });
            }

            // 点击处理：选中/交换相邻方块
            function handlePieceClick(pos) {
                if (gameCompleted) return;
                if (selectedPos === null) {
                    selectedPos = pos;
                    renderPuzzle();
                    return;
                }
                if (selectedPos === pos) {
                    selectedPos = null;
                    renderPuzzle();
                    return;
                }
                // 判断是否相邻（上下左右）
                const row1 = Math.floor(selectedPos / gridSize), col1 = selectedPos % gridSize;
                const row2 = Math.floor(pos / gridSize), col2 = pos % gridSize;
                if (Math.abs(row1 - row2) + Math.abs(col1 - col2) === 1) {
                    // 交换两个方块
                    [pieces[selectedPos], pieces[pos]] = [pieces[pos], pieces[selectedPos]];
                    if (!gameStarted) { gameStarted = true; startTimer(); }
                    moves++;
                    updateStats();
                    selectedPos = null;
                    renderPuzzle();
                    checkCompletion();
                } else {
                    // 不相邻：更换选中
                    selectedPos = pos;
                    renderPuzzle();
                }
            }

            function checkCompletion() {
                const total = gridSize * gridSize;
                const expected = Array.from({ length: total }, (_, i) => i);
                if (pieces.every((p, i) => p === expected[i])) {
                    gameCompleted = true;
                    stopTimer();
                    showCompletionModal();
                }
            }

            function updateStats() {
                moveCountDisplay.textContent = moves;
                const total = gridSize * gridSize;
                const expected = Array.from({ length: total }, (_, i) => i);
                let correct = pieces.filter((p, i) => p === expected[i]).length;
                const progress = Math.round((correct / total) * 100);
                progressFill.style.width = progress + '%';
                progressText.textContent = progress + '%';
            }

            function startTimer() {
                if (!timerInterval) timerInterval = setInterval(() => { timerSeconds++; timerDisplay.textContent = timerSeconds; }, 1000);
            }
            function stopTimer() {
                clearInterval(timerInterval);
                timerInterval = null;
            }

            function resetGame() {
                stopTimer();
                initPuzzle();
                previewImg.src = currentBuilding.largeImg;
                previewImg.onerror = function() { this.style.display = 'none'; };
                previewImg.onload = function() { this.style.display = 'block'; };
            }

            function showCompletionModal() {
                const names = ['太和殿匠人', '天坛守护者', '佛香阁大师', '山庄营造家', '东陵守护者'];
                const idx = buildings.indexOf(currentBuilding);
                achievementText.textContent = '🏆 解锁成就：' + (names[idx] || '建筑拼图达人');
                const score = Math.max(55, 99 - Math.floor(timerSeconds / 3) - moves);
                knowledgeText.textContent = currentBuilding.knowledge + `\n\n⏱️ 用时 ${timerSeconds} 秒 | 👣 ${moves} 步 | 🎯 击败了 ${score}% 的玩家`;
                completionModal.classList.add('show');
            }

            document.getElementById('resetBtn').addEventListener('click', resetGame);
            document.getElementById('submitBtn').addEventListener('click', () => {
                if (!gameCompleted && gameStarted) { checkCompletion(); if (!gameCompleted) alert('拼图还未完成，请继续努力！'); }
                else if (!gameStarted) alert('请先开始拼图！');
            });
            document.getElementById('shareBtn').addEventListener('click', () => {
                if (!gameCompleted) { alert('请先完成拼图再分享！'); return; }
                const text = `🏛️ 我在"样式雷·建筑拼图"中完成了${currentBuilding.name}拼图！\n⏱️ 用时${timerSeconds}秒 | 👣 ${moves}步\n一起来感受古建筑之美吧！`;
                if (navigator.share) navigator.share({ title: '样式雷·建筑拼图', text: text }).catch(() => {});
                else navigator.clipboard.writeText(text).then(() => alert('已复制分享文案到剪贴板！'));
            });
            document.getElementById('modalClose').addEventListener('click', () => completionModal.classList.remove('show'));
            document.getElementById('hintToggle').addEventListener('click', () => {
                showHint = !showHint;
                document.getElementById('hintToggle').classList.toggle('active', showHint);
                renderPuzzle();
            });

            document.querySelectorAll('#difficultySelect .diff-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('#difficultySelect .diff-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    gridSize = parseInt(btn.dataset.diff);
                    resetGame();
                });
            });

            // 键盘控制：选中方块后按方向键交换
            document.addEventListener('keydown', (e) => {
                if (gameCompleted) return;
                if (selectedPos === null) return;
                const row = Math.floor(selectedPos / gridSize), col = selectedPos % gridSize;
                let targetPos = -1;
                switch (e.key) {
                    case 'ArrowUp': if (row > 0) targetPos = selectedPos - gridSize; break;
                    case 'ArrowDown': if (row < gridSize - 1) targetPos = selectedPos + gridSize; break;
                    case 'ArrowLeft': if (col > 0) targetPos = selectedPos - 1; break;
                    case 'ArrowRight': if (col < gridSize - 1) targetPos = selectedPos + 1; break;
                }
                if (targetPos >= 0) {
                    e.preventDefault();
                    handlePieceClick(targetPos);
                }
            });

            window.addEventListener('resize', () => renderPuzzle());

            document.querySelectorAll('.game-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    const pages = { puzzle: 'game2.html', craft: 'game3.html', quiz: 'game4.html', wall: 'game5.html' };
                    window.location.href = pages[tab.dataset.game];
                });
            });

            function init() {
                renderBuildingCards();
                const params = new URLSearchParams(window.location.search);
                const buildingIndex = parseInt(params.get('building'));
                if (!isNaN(buildingIndex) && buildingIndex >= 0 && buildingIndex < buildings.length) {
                    currentBuilding = buildings[buildingIndex];
                    renderBuildingCards();
                }
                initPuzzle();
                previewImg.src = currentBuilding.largeImg;
                previewImg.onload = function() { this.style.display = 'block'; };
                previewImg.onerror = function() { this.style.display = 'none'; };
            }
            init();
        })();
    </script>
</body>
</html>
