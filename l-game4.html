<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>时序传新 · 排布样式雷古今文脉</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #d9ccaa 0%, #b79762 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', '华文楷书', 'Microsoft YaHei', '宋体', 'KaiTi', 'Georgia', serif;
            padding: 20px;
        }

        /* 主容器 */
        .game-wrapper {
            max-width: 1300px;
            width: 100%;
            background: #fffef5;
            border-radius: 3rem 2rem 3rem 2rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3), inset 0 1px 2px rgba(255, 250, 210, 0.8);
            overflow: hidden;
        }

        /* 头部 */
        .header {
            background: #2b4a38;
            padding: 1.2rem 1.5rem;
            text-align: center;
            border-bottom: 6px solid #e5b86b;
        }
        .header h1 {
            font-size: 1.9rem;
            letter-spacing: 4px;
            color: #fef0cf;
            text-shadow: 3px 3px 0 #1e3526;
            font-weight: 500;
        }
        .header p {
            color: #e5dbb5;
            font-size: 0.9rem;
            margin-top: 6px;
            font-style: italic;
        }

        /* 核心内容区 */
        .game-main {
            padding: 1.8rem;
        }

        /* 排序说明区域 */
        .timeline-hint {
            background: #f4ecdb;
            border-radius: 2rem;
            padding: 12px 20px;
            margin-bottom: 24px;
            text-align: center;
            color: #7a592e;
            font-size: 0.9rem;
            border: 1px solid #e2cf9e;
        }

        /* 排序放置区 (时间轴容器) */
        .timeline-sort-area {
            background: #ecdbaa;
            border-radius: 2rem;
            padding: 1.2rem;
            margin-bottom: 2rem;
            box-shadow: inset 0 0 0 2px #fff6e6, 0 6px 12px rgba(0,0,0,0.1);
        }
        .sort-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #5b3e1f;
            text-align: center;
            margin-bottom: 1rem;
            letter-spacing: 2px;
        }
        .sort-slots {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
            justify-content: center;
            align-items: stretch;
        }
        .slot-card {
            flex: 1;
            min-width: 160px;
            background: #fef3e2;
            border-radius: 1.2rem;
            border: 2px dashed #c2a066;
            padding: 0.8rem;
            transition: all 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            text-align: center;
        }
        .slot-placeholder {
            color: #aa8b55;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 140px;
        }
        .slot-placeholder span {
            font-size: 2rem;
            margin-bottom: 6px;
        }
        /* 卡片样式 (可拖拽卡片) */
        .drag-card {
            background: #fff2df;
            border-radius: 1.2rem;
            padding: 1rem 0.6rem;
            cursor: grab;
            border: 2px solid #dbbb89;
            box-shadow: 0 8px 14px rgba(0,0,0,0.1);
            transition: 0.1s;
            width: 100%;
            text-align: center;
        }
        .drag-card:active {
            cursor: grabbing;
        }
        .drag-card.dragging {
            opacity: 0.4;
        }
        .card-icon {
            font-size: 2rem;
            margin-bottom: 8px;
        }
        .card-title {
            font-weight: bold;
            font-size: 1.1rem;
            color: #5a3a1e;
        }
        .card-desc {
            font-size: 0.7rem;
            color: #9b784b;
            margin-top: 6px;
        }
        /* 放置在槽位中的卡片样式 */
        .slot-card .drag-card {
            cursor: grab;
            background: #f9efdf;
            width: 100%;
            margin: 0;
        }
        /* 正确顺序渐变发光 */
        .slot-card.correct-order {
            background: #d9e6c3;
            border: 2px solid #6c9c3e;
            box-shadow: 0 0 12px #a3cf6e, inset 0 0 4px #f9ffdd;
        }
        .slot-card.correct-order .drag-card {
            background: #e2f0ce;
            border-color: #6c9c3e;
        }

        .drag-card:hover {
            transform: translateY(-3px);
            background: #ffefda;
        }

        /* 打乱区域（备用卡片池 - 未被放置的卡片） */
        .chaos-area {
            background: #f7efdb;
            border-radius: 2rem;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            overflow-x: auto; /* 新增：横向滚动适配小屏幕 */
        }
        .chaos-title {
            font-size: 1rem;
            font-weight: bold;
            color: #8a653c;
            margin-bottom: 12px;
            text-align: center;
        }
        /* 关键修改：待排序卡片强制单行显示 */
        .chaos-cards {
    display: flex;
    gap: 1rem;
    justify-content: center;     /* 改为居中 */
    align-items: stretch;
    flex-wrap: nowrap;
    min-width: fit-content;
    padding-bottom: 8px;
}
        /* 调整待排序卡片宽度，保证单行显示时的适配 */
        .chaos-cards .drag-card {
            min-width: 180px; /* 固定最小宽度，保证卡片内容不挤压 */
            max-width: 200px; /* 限制最大宽度 */
            flex-shrink: 0; /* 禁止卡片收缩，保证单行完整性 */
        }

        /* 底部按钮 */
        .footer-buttons {
            display: flex;
            justify-content: center;
            gap: 1.8rem;
            padding: 0.8rem 1rem 1.8rem;
            flex-wrap: wrap;
        }
        .btn {
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            padding: 0.7rem 1.8rem;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            background: #e1cf9e;
            color: #4d3118;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-bottom: 3px solid #a2723c;
            transition: 0.1s;
        }
        .btn:active {
            transform: translateY(2px);
        }
        .btn-secondary {
            background: #c3aa73;
            color: #2d2b1c;
        }
        .btn-primary {
            background: #9b6f41;
            color: #fff3e0;
            border-bottom-color: #583e1f;
        }

        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2f2a1ce6;
            backdrop-filter: blur(12px);
            color: #fff3cf;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.9rem;
            z-index: 99;
            pointer-events: none;
            transition: 0.2s;
            opacity: 0;
            white-space: nowrap;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(28, 24, 16, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }
        .modal-content {
            background: #fff8ec;
            border-radius: 3rem 2rem 3rem 2rem;
            max-width: 480px;
            width: 85%;
            text-align: center;
            padding: 2rem;
            border: 8px double #c6863c;
        }
        .modal-content h2 {
            font-size: 1.9rem;
            color: #5f3c1e;
        }
        .modal-content p {
            font-size: 1.1rem;
            color: #456b3a;
            margin: 15px 0;
        }
        .modal-close {
            background: #b5773a;
            border: none;
            padding: 8px 26px;
            font-size: 1rem;
            border-radius: 40px;
            color: white;
            cursor: pointer;
        }
        footer {
            text-align: center;
            font-size: 0.7rem;
            color: #bc9a64;
            padding: 8px 0 18px;
            border-top: 1px solid #e9dbbc;
        }
        /* 响应式适配调整 */
        @media (max-width: 750px) {
            .sort-slots { flex-direction: column; align-items: center; }
            .slot-card { width: 100%; max-width: 300px; }
            /* 小屏幕下待排序卡片仍保持单行，通过横向滚动查看 */
            .chaos-cards {
                justify-content: flex-start;
            }
            .chaos-area {
                padding: 0.8rem;
            }
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="header">
        <h1>时序传新 · 排布样式雷古今文脉</h1>
       
    </div>

    <div class="game-main">
      

        <!-- 排序放置区 (时间轴槽位) -->
        <div class="timeline-sort-area">
            <div class="sort-title">🏺 时间轴 · 传承创新序列 🏺</div>
            <div class="sort-slots" id="sortSlotsContainer">
                <!-- 5个槽位动态生成 -->
            </div>
        </div>

        <!-- 打乱卡片区 (未放置区) -->
        <div class="chaos-area" id="chaosArea">
            <div class="chaos-title">📦 待排序卡片 (拖拽至上方时间轴)</div>
            <div class="chaos-cards" id="chaosCardsContainer"></div>
        </div>
    </div>

    <div class="footer-buttons">
        <button class="btn btn-secondary" id="resetBtn">🔄 重新排序</button>
        <button class="btn btn-primary" id="infoBtn">📖 查看元素解读</button>
    </div>
    <footer>承百年古建底蕴，启当代创新新篇 · 样式雷文脉永续</footer>
</div>

<div id="completionModal" class="modal-overlay">
    <div class="modal-content">
        <h2>✨ 时序排布完成 ✨</h2>
        <p>承百年古建底蕴，启当代创新新篇</p>
        <p style="font-size:0.9rem;">技艺演变 · 从样式雷图档到数字文创，匠心永恒</p>
        <button class="modal-close" id="closeModalBtn">传 承 再 启</button>
    </div>
</div>
<div id="toastMessage" class="toast-msg"></div>

<script>
    (function(){
        // ---------- 卡片数据 (按照正确顺序 0~4) ----------
        const cardsData = [
            { id: 0, name: "样式雷手绘图纸", desc: "清代样式房原稿，墨线界画，尺度精微", icon: "📜", era: "古代 · 清" },
            { id: 1, name: "古建筑烫样", desc: "雷氏独创立体模型，木纸结合，精准推敲", icon: "🏛️", era: "古代 · 清晚期" },
            { id: 2, name: "实物古建", desc: "依图施工落成，斗拱梁架巍然", icon: "🏯", era: "明清至今" },
            { id: 3, name: "文创衍生产品", desc: "样式雷IP、文具、数字藏品活化利用", icon: "🎁", era: "当代文创" },
            { id: 4, name: "数字VR复原", desc: "虚拟现实重现三山五园，沉浸式文保", icon: "🥽", era: "数字时代" }
        ];
        // 正确顺序索引 (id数组)
        const correctOrderIds = [0,1,2,3,4];
        
        // 当前槽位状态: 每个槽位存储 cardId 或 null
        let slotCards = new Array(5).fill(null);
        // 存储未放置的卡片id列表
        let remainingCardIds = [...correctOrderIds];
        
        let draggedCardId = null;   // 正在拖拽的卡片id
        let draggedSourceType = null; // 'slot' or 'chaos'

        // DOM 元素
        const sortSlotsContainer = document.getElementById('sortSlotsContainer');
        const chaosCardsContainer = document.getElementById('chaosCardsContainer');
        const resetBtn = document.getElementById('resetBtn');
        const infoBtn = document.getElementById('infoBtn');
        const modal = document.getElementById('completionModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const toastDiv = document.getElementById('toastMessage');
        
        function showToast(msg, duration=1800) {
            toastDiv.textContent = msg;
            toastDiv.style.opacity = '1';
            setTimeout(() => { toastDiv.style.opacity = '0'; }, duration);
        }
        
        // 检查顺序是否完全正确
        function checkOrderComplete() {
            for(let i=0; i<slotCards.length; i++) {
                if(slotCards[i] !== correctOrderIds[i]) return false;
            }
            return true;
        }
        
        // 更新所有槽位的高亮效果 (正确顺序时添加发光类)
        function updateSlotsHighlight() {
            const slots = document.querySelectorAll('.slot-card');
            for(let i=0; i<slots.length; i++) {
                const slot = slots[i];
                const cardId = slotCards[i];
                if(cardId !== null && cardId === correctOrderIds[i]) {
                    slot.classList.add('correct-order');
                } else {
                    slot.classList.remove('correct-order');
                }
            }
        }
        
        // 重新渲染整个界面 (基于 slotCards 和 remainingCardIds)
        function renderFull() {
            renderSlots();
            renderChaos();
            updateSlotsHighlight();
            // 检测是否全部正确并且所有卡片都已放置 (remaining中无卡,且slot全部正确填满)
            const allSlotsFilled = slotCards.every(c => c !== null);
            if(allSlotsFilled && checkOrderComplete()) {
                // 通关弹窗
                modal.classList.add('active');
            } else if(allSlotsFilled && !checkOrderComplete()) {
                // 顺序错提醒（隐式在拖拽提示中展示）
                // 可额外toast, 但拖拽中已提示
            }
        }
        
        // 渲染时间轴槽位
        function renderSlots() {
            sortSlotsContainer.innerHTML = '';
            for(let i=0; i<slotCards.length; i++) {
                const slotDiv = document.createElement('div');
                slotDiv.className = 'slot-card';
                slotDiv.setAttribute('data-slot-index', i);
                // 槽位内部
                const cardId = slotCards[i];
                if(cardId !== null) {
                    const card = cardsData.find(c => c.id === cardId);
                    if(card) {
                        const cardElem = createCardElement(card, 'slot', i);
                        slotDiv.appendChild(cardElem);
                    }
                } else {
                    // 空槽位占位符
                    const placeholder = document.createElement('div');
                    placeholder.className = 'slot-placeholder';
                    placeholder.innerHTML = `<span>⬚</span><small>拖拽至此</small>`;
                    slotDiv.appendChild(placeholder);
                }
                // 拖拽放置目标事件
                slotDiv.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                });
                slotDiv.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const targetSlotIdx = parseInt(slotDiv.getAttribute('data-slot-index'));
                    if(isNaN(targetSlotIdx)) return;
                    if(draggedCardId === undefined || draggedCardId === null) return;
                    // 处理将卡片放入槽位
                    handleDropToSlot(targetSlotIdx);
                });
                sortSlotsContainer.appendChild(slotDiv);
            }
        }
        
        // 处理拖拽放置到槽位
        function handleDropToSlot(targetSlotIdx) {
            if(draggedCardId === null) return;
            // 查找拖拽的卡片数据
            const draggedCard = cardsData.find(c => c.id === draggedCardId);
            if(!draggedCard) {
                resetDragState();
                return;
            }
            // 情况1: 从混乱区拖拽过来
            if(draggedSourceType === 'chaos') {
                // 如果目标槽位已有卡片，先交换/或者挪移? 规则：若槽位有卡片，则交换至混乱区
                const targetCardId = slotCards[targetSlotIdx];
                if(targetCardId !== null) {
                    // 交换: 原槽位卡片移动到混乱区域，新卡片放入槽位
                    const oldCardId = slotCards[targetSlotIdx];
                    // 将旧卡片放回混乱区
                    if(!remainingCardIds.includes(oldCardId)) remainingCardIds.push(oldCardId);
                    // 新卡片放入槽位
                    slotCards[targetSlotIdx] = draggedCardId;
                    // 从混乱区移除 dragCard
                    const idxInRemaining = remainingCardIds.indexOf(draggedCardId);
                    if(idxInRemaining !== -1) remainingCardIds.splice(idxInRemaining,1);
                    showToast(`已将「${draggedCard.name}」放入槽位，与原有卡片交换`, 1000);
                } else {
                    // 空槽位直接放入
                    slotCards[targetSlotIdx] = draggedCardId;
                    const idxInRemaining = remainingCardIds.indexOf(draggedCardId);
                    if(idxInRemaining !== -1) remainingCardIds.splice(idxInRemaining,1);
                    showToast(`「${draggedCard.name}」已放入时间轴`, 800);
                }
            } 
            // 情况2: 从槽位拖拽移动 (交换逻辑)
            else if(draggedSourceType === 'slot') {
                const sourceSlotIdx = draggedSourceSlotIndex;
                if(sourceSlotIdx === undefined || sourceSlotIdx === null) {
                    resetDragState(); 
                    return;
                }
                if(sourceSlotIdx === targetSlotIdx) {
                    resetDragState(); 
                    return;
                }
                // 交换两个槽位的卡片
                const sourceCardId = slotCards[sourceSlotIdx];
                const targetCardId = slotCards[targetSlotIdx];
                if(sourceCardId === null) {
                    resetDragState(); 
                    return;
                }
                // 交换
                slotCards[targetSlotIdx] = sourceCardId;
                slotCards[sourceSlotIdx] = targetCardId;
                // 如果目标槽位原来不为空，且原来卡片在remaining中不应存在，它现在移动到sourceSlot需确保remaining没有重复
                // 若targetCardId不为空, 则放到source槽位中是合理的。不需要调整remaining，因为槽位之间移动不改变剩余池
                // 但是需要确保remaining不包含任何槽位中的卡片
                for(let i=0; i<slotCards.length; i++) {
                    const idInSlot = slotCards[i];
                    if(idInSlot !== null && remainingCardIds.includes(idInSlot)) {
                        // 清理剩余池中多余的槽位卡片（保险）
                        const idx = remainingCardIds.indexOf(idInSlot);
                        if(idx !== -1) remainingCardIds.splice(idx,1);
                    }
                }
                showToast(`交换顺序，继续调整文脉时序`, 1000);
            }
            // 渲染更新 & 校验顺序
            renderFull();
            resetDragState();
            // 检查顺序完整性
            const allFilled = slotCards.every(c => c !== null);
            if(allFilled && checkOrderComplete()) {
                modal.classList.add('active');
            } else if(allFilled && !checkOrderComplete()) {
                showToast("排序尚未完全正确，可继续调整至从古到今", 1300);
            }
        }
        
        let draggedSourceSlotIndex = null;
        // 重置拖拽状态
        function resetDragState() {
            draggedCardId = null;
            draggedSourceType = null;
            draggedSourceSlotIndex = null;
        }
        
        // 创建卡片DOM元素 (可拖拽)
        function createCardElement(card, source, slotIdx=null) {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'drag-card';
            cardDiv.setAttribute('data-card-id', card.id);
            cardDiv.setAttribute('draggable', 'true');
            cardDiv.innerHTML = `
                <div class="card-icon">${card.icon}</div>
                <div class="card-title">${card.name}</div>
                <div class="card-desc">${card.desc}<br>${card.era}</div>
            `;
            cardDiv.addEventListener('dragstart', (e) => {
                draggedCardId = card.id;
                draggedSourceType = source;
                if(source === 'slot' && slotIdx !== null) draggedSourceSlotIndex = slotIdx;
                e.dataTransfer.setData('text/plain', card.id);
                e.dataTransfer.effectAllowed = 'move';
                cardDiv.classList.add('dragging');
            });
            cardDiv.addEventListener('dragend', (e) => {
                cardDiv.classList.remove('dragging');
                // 不立即重置，确保drop事件读取到draggedCardId后再异步重置
                // 但 drop 时会处理，之后执行 resetDragState 在渲染后。这里不做重置 让drop里调用重置 避免时序
            });
            return cardDiv;
        }
        
        // 渲染混乱区卡片 (未放置的卡片)
        function renderChaos() {
            chaosCardsContainer.innerHTML = '';
            // 根据 remainingCardIds 展示卡片，并且保证顺序任意展示（打乱展现即可，但保留原样）
            const shuffledRemaining = [...remainingCardIds];
            // 随机打乱视觉顺序使得更像是散落
            for(let i=shuffledRemaining.length-1;i>0;i--){
                const j=Math.floor(Math.random()*(i+1));
                [shuffledRemaining[i], shuffledRemaining[j]] = [shuffledRemaining[j], shuffledRemaining[i]];
            }
            shuffledRemaining.forEach(cardId => {
                const card = cardsData.find(c => c.id === cardId);
                if(card) {
                    const cardElem = createCardElement(card, 'chaos');
                    chaosCardsContainer.appendChild(cardElem);
                }
            });
            if(remainingCardIds.length === 0) {
                const emptyHint = document.createElement('div');
                emptyHint.innerText = "✨ 所有卡片已放入时间轴 ✨";
                emptyHint.style.padding = "20px";
                emptyHint.style.color = "#a57c48";
                chaosCardsContainer.appendChild(emptyHint);
            }
        }
        
        // 重置游戏: 清空槽位，所有卡片放回混乱区，顺序打乱remaining
        function resetGame() {
            slotCards = new Array(5).fill(null);
            remainingCardIds = [...correctOrderIds];
            // 在混乱区打乱初始顺序 (视觉)
            for(let i=remainingCardIds.length-1;i>0;i--){
                const j=Math.floor(Math.random()*(i+1));
                [remainingCardIds[i], remainingCardIds[j]] = [remainingCardIds[j], remainingCardIds[i]];
            }
            draggedCardId = null;
            draggedSourceType = null;
            draggedSourceSlotIndex = null;
            renderFull();
            if(modal.classList.contains('active')) modal.classList.remove('active');
            showToast("已重置时间轴，可重新排布古今文脉", 1200);
        }
        
        // 弹出元素文化解读
        function showInterpretation() {
            let msg = "📖 样式雷文脉解读 📖\n\n";
            cardsData.forEach(card => {
                msg += `${card.icon} ${card.name}（${card.era}）\n${card.desc}\n\n`;
            });
            msg += "🔹 排序脉络：清代样式雷图纸 → 烫样推敲 → 建成古建实物 → 当代文创活化 → 数字VR创新传承";
            alert(msg);
        }
        
        // 拖拽防止页面默认
        window.addEventListener('dragstart', (e) => {
            if(!e.target.closest('.drag-card')) e.preventDefault();
        });
        
        resetBtn.addEventListener('click', resetGame);
        infoBtn.addEventListener('click', showInterpretation);
        closeModalBtn.addEventListener('click', () => {
            modal.classList.remove('active');
            resetGame();
        });
        modal.addEventListener('click', (e) => {
            if(e.target === modal) {
                modal.classList.remove('active');
                resetGame();
            }
        });
        
        // 初始化
        function init() {
            resetGame();
        }
        init();
    })();
</script>
</body>
</html>
